services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      # $$ escapes Compose interpolation: the variables are resolved inside the container.
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    # Upstream MinIO no longer publishes images; pgsty/minio is a community rebuild from the same source
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001" --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cadence}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cadence-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web object browser
    volumes:
      - minio-data:/data
      - ./.certs/minio:/certs:ro
     
      

volumes:
  postgres-data:
  minio-data: