spring.application.name=cadense

spring.config.import=optional:file:.env[.properties]

# Object storage (S3 API). Provider-specific settings live in application-minio / application-r2
# All files are private: the API hands out short-lived signed URLs to their owner only
storage.bucket=cadence-files
storage.signed-url-ttl=1h
storage.auto-create-bucket=false

# Docker
spring.docker.compose.enabled=true

# CORE
spring.profiles.group.local=postgres,minio
spring.profiles.group.prod=postgres,r2

spring.profiles.active=local


# base endpoint configs
api-endpoint = api/v1

# Cookie SameSite configuration:  "Lax", "None" or "Strict"   
cookie-same-site = ${COOKIE_SAME_SITE:None}

access-cookie-name = ${ACCESS_COOKIE_NAME:access_token}
refresh-cookie-name = ${REFRESH_COOKIE_NAME:refresh_token}

# CORS
frontend-domain = ${FRONTEND_DOMAIN:https://localhost:5173}


# jwt secrets
jwt-secret=${JWT_SECRET:0kuSAcoQ7qpnLOO92S2VCrkc8g2tiDrWgZ5V+lzYWqA=}
access-token-duration-minutes=${ACCESS_TOKEN_DURATION_MINUTES:5}
refresh-token-duration-days=${REFRESH_TOKEN_DURATION_DAYS:30}

# SSL config (ones for localhost were created by mkcert)
server.ssl.key-store=${SSL_KEYSTORE_PATH: file:.certs/localhost+1.p12 }
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.port=8443

# Stripe testing
stripe.api.key=${STRIPE_API_KEY:}
stripe.success.url=${STRIPE_SUCCESS_URL:https://localhost:5173/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:https://localhost:5173/cancel}

# mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# dates
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso