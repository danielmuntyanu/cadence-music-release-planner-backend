# ===== Database: PostgreSQL (Docker) =====
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:db_cadense}
spring.datasource.username=${POSTGRES_USER:myuser}
spring.datasource.password=${POSTGRES_PASSWORD:verysecret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Connection pool (HikariCP) =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# ===== JPA / Hibernate =====
# dev: create-drop (схема пересоздаётся при каждом запуске)
# для сохранения данных между запусками: update; для prod: validate или none
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ===== SQL logging =====
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.orm.jdbc.bind=trace

# ===== SQL init (data.sql) =====
spring.sql.init.mode=always