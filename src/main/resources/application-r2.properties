# Cloudflare R2 (production). Secrets come only from the environment, never from this file
storage.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
# Browsers reach R2 directly, so signed URLs are signed for the same host
storage.public-endpoint=${storage.endpoint}
storage.region=auto
storage.access-key=${R2_ACCESS_KEY_ID}
storage.secret-key=${R2_SECRET_ACCESS_KEY}
storage.bucket=${R2_BUCKET:cadence-files}
storage.auto-create-bucket=false